<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="快思科技 CRIS — 工業 4.0 智慧製造解決方案，APS 生產排程、ESG 碳盤查、AI Agent 工作流" />
    <title>CRIS快思｜智能製造 × 永續ESG × 企業AI解決方案</title>
    <script>
      // GitHub Pages 會把 /index、/index.html 當成 index.html 回 200（Google 也收錄了 /index），
      // 但 React Router 沒有這個路由，只會渲染出導覽列與頁尾、中間空白，因此在 App 載入前導回首頁
      if (/^\/index(\.html)?\/?$/.test(location.pathname)) {
        location.replace('/' + location.search + location.hash)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
